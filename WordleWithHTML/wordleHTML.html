<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle Game</title>
  <link rel="stylesheet" href="wordleHTML.css" />

<body style="width: 100%; max-width: 500px; margin: 0 auto; border: 1px solid black; padding: 20px; box-sizing: border-box;">
  <h1 style="text-align: center;">Wordle Game</h1>
  <div id="game-container">
    <div id="guesses-container"></div>
    <input type="text" id="guess-input" maxlength="5" minlength="5" />
    <button id="submit-guess" onclick="submitGuess()">Submit Guess</button>
    <p id="message"></p>
  </div>
  <div id="grid-container">
    <grid id="grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 20px;"> 
      <div id="row1" class="row">
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
      </div>
      <div id="row2" class="row">
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
      </div>
      <div id="row3" class="row">
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
      </div>
      <div id="row4" class="row">
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
      </div>
      <div id="row5" class="row">
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
        <div class="letterBox">box</div>
      </div>
      
    </grid>
  </div>
  
  <script src="wordleHTML.js"></script>
</body>
</html>
