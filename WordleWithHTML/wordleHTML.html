<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle Game</title>
  <link rel="stylesheet" href="wordleHTML.css" />

    .letterBox {
      width: 50px;

      border: 1px solid #000;

</head>
<body style="width: 100%; max-width: 500px; margin: 0 auto; border: 1px solid black; padding: 20px; box-sizing: border-box;">
  <h1 style="text-align: center;">Wordle Game</h1>
  <div id="game-container">
    <div id="guesses-container"></div>
    <input type="text" id="guess-input" maxlength="5" minlength="5" placeholder="Enter your guess" />
    <button id="submit-guess" onclick="submitGuess()">Submit Guess</button>
    <button id="reset-button" onclick="resetGame()">Reset Game</button>
  </div>
  <div id="grid-container">
    <grid id="grid">
      <div id="row1" class="row">
        <div id ="r1l1"class="letterBox"></div>
        <div id ="r1l2"class="letterBox"></div>
        <div id ="r1l3"class="letterBox"></div>
        <div id ="r1l4"class="letterBox"></div>
        <div id ="r1l5"class="letterBox"></div>
      </div>
      <div id="row2" class="row">
        <div id ="r2l1"class="letterBox"></div>
        <div id ="r2l2"class="letterBox"></div>
        <div id ="r2l3"class="letterBox"></div>
        <div id ="r2l4"class="letterBox"></div>
        <div id ="r2l5"class="letterBox"></div>
      </div>
      <div id="row3" class="row">
        <div id ="r3l1"class="letterBox"></div>
        <div id ="r3l2"class="letterBox"></div>
        <div id ="r3l3"class="letterBox"></div>
        <div id ="r3l4"class="letterBox"></div>
        <div id ="r3l5"class="letterBox"></div>
      </div>
      <div id="row4" class="row">
        <div id ="r4l1"class="letterBox"></div>
        <div id ="r4l2"class="letterBox"></div>
        <div id ="r4l3"class="letterBox"></div>
        <div id ="r4l4"class="letterBox"></div>
        <div id ="r4l5"class="letterBox"></div>
      </div>
      <div id="row5" class="row">
        <div id ="r5l1"class="letterBox"></div>
        <div id ="r5l2"class="letterBox"></div>
        <div id ="r5l3"class="letterBox"></div>
        <div id ="r5l4"class="letterBox"></div>
        <div id ="r5l5"class="letterBox"></div>
      </div>
      
    </grid>
  </div>
  
  <script src="wordleHTML.js"></script>
</body>
</html>
